# New-SAE RD moderate (final_step_94). Copied from configs/eval/rd_october_math_basic.yaml: only the model list
# (October RD -> RD moderate, local checkpoint) and output_dir changed; LKD / October RD outputs reused.
models:
- name: qwen-rd-newsae-moderate-final-think
  checkpoint: ./checkpoints/rd_newsae_moderate/final_step_94
  trust_remote_code: true
  dtype: bfloat16
  device_map: auto
  enable_thinking: true
  model_type: qwen
  strip_language_model_prefix: true
benchmarks:
- math500
- aime25
output_dir: ./eval_outputs/rd_newsae/eval_mod/basic_math
cache_dir: ./cache
split: test
max_samples: null
seed: 42
require_real_data: true
generation:
  max_new_tokens: 4096
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  repetition_penalty: 1.0
  pass_at_k: 1
  stop_at_final_answer: true
  batch_size: 8
benchmark_options:
  aime25:
    max_new_tokens: 32768
    batch_size: 4
