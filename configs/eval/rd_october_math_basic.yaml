# October ReasonDistill (indexing fix, retrained), basic evals. Identical to
# configs/eval/qwen_math_basic.yaml except the model list: base and LKD outputs from
# eval_outputs/test_math/20260925T181224Z-112470 are reused, same seed and
# settings, so comparisons stay paired per question.
#
# Run: python -m custom_eval.run_eval --config configs/eval/rd_october_math_basic.yaml
# All 500 MATH-500 and 30 AIME 2025 questions, reasoning mode, pass@1.
# python -m custom_eval.run_eval --config configs/eval/qwen_math_basic.yaml
models:
  - name: qwen-reasondistill-october-continue-epoch_1-think
    checkpoint: Khaquan/qwen-khaquanS-distillations
    subfolder: qwen-reasondistill-october/qwen_reasondistill_final_continue/epoch_1
    trust_remote_code: true
    dtype: bfloat16
    device_map: auto
    enable_thinking: true
    model_type: qwen
    strip_language_model_prefix: true
benchmarks:
  - math500
  - aime25

output_dir: ./eval_outputs/test_math_rd_october
cache_dir: ./cache
split: test
max_samples: null
seed: 42
require_real_data: true

generation:
  max_new_tokens: 4096
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  repetition_penalty: 1.0
  pass_at_k: 1
  stop_at_final_answer: true   # End a row once its final answer is complete.
  batch_size: 8

benchmark_options:
  aime25:
    max_new_tokens: 32768
    batch_size: 4
