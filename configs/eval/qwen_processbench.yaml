# ProcessBench (RUN_LOG 8s): find the earliest erroneous step in a worked solution.
# Tests whether ReasonDistill's extra self-reflection is a usable skill. LKD vs October
# RD, 1,600 items (all 400 GSM8K + 400 each MATH / OlympiadBench / Omni-MATH, seed 0),
# official critique prompt, 1 sample, thinking on, sampling as in every Qwen run.
#
# Run: venv_fla/bin/python -m custom_eval.run_eval --config configs/eval/qwen_processbench.yaml
models:
  - name: qwen-logit-kd-continue-epoch_1-think
    checkpoint: Khaquan/qwen-khaquanS-distillations
    subfolder: qwen-logitKD-final/qwen_logit_kd_continue/epoch_1
    trust_remote_code: true
    dtype: bfloat16
    device_map: auto
    enable_thinking: true
    model_type: qwen
    strip_language_model_prefix: true
  - name: qwen-reasondistill-october-continue-epoch_1-think
    checkpoint: Khaquan/qwen-khaquanS-distillations
    subfolder: qwen-reasondistill-october/qwen_reasondistill_final_continue/epoch_1
    trust_remote_code: true
    dtype: bfloat16
    device_map: auto
    enable_thinking: true
    model_type: qwen
    strip_language_model_prefix: true
benchmarks:
  - processbench
output_dir: ./eval_outputs/processbench
cache_dir: ./cache
split: test
max_samples: null
seed: 42
require_real_data: true
save_partial_every: 2
generation:
  max_new_tokens: 8192
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  repetition_penalty: 1.0
  pass_at_k: 1
  stop_at_final_answer: true
  batch_size: 32
