# New-SAE RD moderate (final_step_94). Copied from configs/eval/qwen_hard_A.yaml: only the model list
# (October RD -> RD moderate, local checkpoint) and output_dir changed; LKD / October RD outputs reused.
models:
- name: qwen-rd-newsae-moderate-final-think
  checkpoint: ./checkpoints/rd_newsae_moderate/final_step_94
  trust_remote_code: true
  dtype: bfloat16
  device_map: auto
  enable_thinking: true
  model_type: qwen
  strip_language_model_prefix: true
benchmarks:
- olympiadbench
output_dir: ./eval_outputs/rd_newsae/eval_mod/hard_math/A
cache_dir: ./cache
split: test
max_samples: null
seed: 42
require_real_data: true
save_partial_every: 2
generation:
  max_new_tokens: 16384
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  repetition_penalty: 1.0
  pass_at_k: 1
  stop_at_final_answer: true
  batch_size: 32
