# New-SAE RD moderate (final_step_94). Copied from configs/eval/rd_october_september_no_think.yaml: only the model list
# (October RD -> RD moderate, local checkpoint) and output_dir changed; LKD / October RD outputs reused.
models:
- name: qwen-rd-newsae-moderate-final-no_think
  checkpoint: ./checkpoints/rd_newsae_moderate/final_step_94
  trust_remote_code: true
  dtype: bfloat16
  device_map: auto
  enable_thinking: false
  model_type: qwen
  strip_language_model_prefix: true
benchmarks:
- gsm8k
- mmlu
- arc-c
- hellaswag
output_dir: ./eval_outputs/rd_newsae/eval_mod/september/no_think
cache_dir: ./cache
split: test
max_samples: 1000
seed: 42
generation:
  max_new_tokens: 4096
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  repetition_penalty: 1.0
  pass_at_k: 1
  batch_size: 32
benchmark_options:
  mmlu:
    subject: all
  hellaswag:
    split: validation
