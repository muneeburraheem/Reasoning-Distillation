# ALPHA SWEEP point: alpha_align = 0.50
#
# Identical to configs/qwen_reasondistill_final_continue.yaml in every respect
# except alpha_align and the output directories. Same data (12,032 examples,
# skip 40,000), same seed 42, same LR schedule, same teacher, and crucially the
# same student_checkpoint - so alpha_align is the ONLY variable across the sweep.
#
# Why: alpha_align=0.25 was chosen to break a ~1.0 training-loss plateau, never
# validated against benchmark accuracy. At 0.25 the student scores 0.682 on
# MATH-500 @32768 versus 0.780 for logit KD (alpha_align=0 by construction),
# so the only two sampled points are the endpoints. This sweep fills the middle.
#
# alpha_align=0.00 is the TRUE control: it isolates the alignment term from the
# same initialisation. It is NOT the same as the existing logit_kd_continue
# checkpoint, which starts from a different stage-1 student.
#
# Run: python scripts/train.py --config configs/qwen_reasondistill_sweep_a050.yaml

experiment:
  name: reasondistill_qwen_sweep_a050
  seed: 42

data:
  dataset: amdeepseek
  max_samples: 12_032
  skip_samples: 40_000
  cache_dir: ./cache

method:
  name: reasondistill
  sae_checkpoint: hf://Khaquan/qwen-khaquanS-distillations/qwen-3.5-4B-L16_16x-SAE/sae.pt
  reason_score_path: hf://Khaquan/qwen-khaquanS-distillations/qwen-3.5-4B-L16_16x-SAE/reasonscore.pt
  reasoning_neuron_count: 512

model:
  teacher: Qwen/Qwen3.5-4B
  student: Qwen/Qwen3.5-2B
  teacher_quantize_8bit: true
  student_checkpoint: hf://Khaquan/qwen-khaquanS-distillations/qwen_reasondistill_final/epoch_1

alignment:
  teacher_align_layer: 16
  student_align_layer: 12
  target_norm: 64.0
  reason_active_threshold: 0.0
  reason_presence_weight: 0.30     # INCREASED: stronger reasoning presence
  reason_rank_weight: 0.15         # INCREASED: prioritize top reasoning features

training:
  max_length: 512                  # 24 GiB card: see docs/RUN_LOG.md - 2048 and 1024 both OOM
  batch_size: 1
  accum_steps: 128
  epochs: 1

  lr: 3.0e-5                       # INCREASED: more aggressive
  min_lr: 1.5e-5                   # INCREASED: keeps optimizer active
  warmup_ratio: 0.04               # Slightly shorter warmup
  weight_decay: 0.015              # Slightly higher regularization
  max_grad_norm: 1.2               # INCREASED: allow larger updates
  adam_betas: [0.9, 0.98]
  optimizer_8bit: true             # 24 GiB card: fp32 Adam moments (~12 GiB) do not fit

  scheduler_type: cosine_restarts
  restart_interval_steps: 31
  restart_mult: 1

loss:
  temperature: 4.0
  alpha_kd: 0.30                   # Unchanged
  alpha_align: 0.50                # SWEEP VARIABLE
  beta_ce: 0.75                    # DECREASED: reduce task loss dominance
  kd_chunk_size: 256               # 24 GiB card: chunk the KL over sequence positions

logging:
  checkpoint_dir: ./checkpoints/qwen_reasondistill_sweep_a050
  log_dir: ./logs/qwen_reasondistill_sweep_a050
  loss_log_entries_per_epoch: 17
  save_every_n_steps: 45