# Generate 8 independent samples per question once; estimate pass@2, @4 and @8.
# python -m custom_eval.run_eval --config configs/sweep_pass_k.yaml
models:
  - name: qwen-3.5-2b-think
    checkpoint: Qwen/Qwen3.5-2B
    trust_remote_code: true
    dtype: bfloat16
    device_map: auto
    enable_thinking: true
    model_type: qwen
    strip_language_model_prefix: false

  - name: qwen-logit-kd-continue-epoch_1-think
    checkpoint: Khaquan/qwen-khaquanS-distillations
    subfolder: qwen-logitKD-final/qwen_logit_kd_continue/epoch_1
    trust_remote_code: true
    dtype: bfloat16
    device_map: auto
    enable_thinking: true
    model_type: qwen
    strip_language_model_prefix: true

  - name: qwen-reasondistill-final-continue-epoch_1-think
    checkpoint: Khaquan/qwen-khaquanS-distillations
    subfolder: qwen_reasondistill_final_continue/epoch_1
    trust_remote_code: true
    dtype: bfloat16
    device_map: auto
    enable_thinking: true
    model_type: qwen
    strip_language_model_prefix: true

benchmarks:
  - mmlu
  - gsm8k
  - hellaswag
  - aime25
  - math500
  - arc-c

output_dir: ./eval_outputs/sweep_pass_k
cache_dir: ./cache
split: test
max_samples: 1000       # Full MATH-500 (500) and AIME 2025 (30); 1000 for the others.
seed: 42
save_partial_every: 5     # write a .partial.json every 5 batches so the run can be inspected live
require_real_data: true

generation:
  max_new_tokens: 8192
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  repetition_penalty: 1.0
  pass_at_k: [2, 4, 8]
  num_samples: 8
  stop_at_final_answer: false  # Enabled per benchmark below (boxed answers only).
  sample_batch_size: 8  # All 8 samples per question in one generate call.
  batch_size: 8         # Questions per batch; 64 concurrent sequences.

benchmark_options:
  gsm8k:
    stop_at_final_answer: true
  math500:
    stop_at_final_answer: true
  mmlu:
    subject: all
  hellaswag:
    split: validation
  aime25:
    max_new_tokens: 8192
    batch_size: 2
    stop_at_final_answer: true
