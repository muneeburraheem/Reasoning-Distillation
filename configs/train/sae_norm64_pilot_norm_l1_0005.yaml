# sweep: norm-64, L1 0.0005
experiment: {seed: 42}
model: {teacher_model_id: Qwen/Qwen3.5-4B, layer: 16, dtype: bfloat16, attn_implementation: null}
data: {dataset: amdeepseek, cache_dir: ./cache, max_samples: 300_000, max_length: 2048}
sae: {latent_dim: null, expansion_factor: 16, sparsity_coefficient: 0.0005, sparsity_warmup_fraction: 0.05}
training:
  sequence_batch_size: 4          # repo: 20 (10 in the HF run); 4 x 2048 fits the 24 GB 4090
  token_batch_size: 8192          # cap never binds at 4 x 2048
  max_train_tokens: 10_000_000
  lr: 2.0e-5
  min_lr: 0.0
  lr_decay_fraction: 0.20
  weight_decay: 0.0
  adam_betas: [0.9, 0.999]
  max_grad_norm: 1.0
  num_workers: 0
logging:
  checkpoint_dir: ./checkpoints/qwen_sae_norm64/pilot_norm_l1_0005
  save_every_steps: 0
  log_every_steps: 200
  log_every_samples: 2000
  log_path: ./checkpoints/qwen_sae_norm64/pilot_norm_l1_0005/metrics.csv
  resume_from: null
